name: Build iOS IPA on Cloud Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 检查并兼容直接上传的 ZIP 压缩包
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "检测到 ZIP 压缩包: $ZIP_FILE，正在自动解压..."
            unzip -o "$ZIP_FILE"
          fi
          APP_FILE=$(find . -name "LivePrompterApp.swift" | head -n 1)
          if [ -z "$APP_FILE" ]; then
            echo "❌ 未找到源码文件 LivePrompterApp.swift，请确认代码已完整上传"
            exit 1
          fi
          SOURCE_DIR=$(dirname $(dirname "$APP_FILE"))
          PROJECT_DIR=$(dirname "$SOURCE_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: 3. 生成兼容格式 Xcode 工程
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat << 'EOF' > project.yml
          name: LivePrompter
          options:
            bundleIdPrefix: com.liveprompter
            xcodeVersion: "15.0"
            deploymentTarget:
              iOS: "16.0"

          targets:
            LivePrompter:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: LivePrompter
              info:
                path: LivePrompter/Info.plist
                properties:
                  CFBundleDisplayName: 流光提词器
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: false
                  NSMicrophoneUsageDescription: "需要使用麦克风监听您的语速，以便实时自动滚动提词。"
                  NSSpeechRecognitionUsageDescription: "需要使用语音识别功能，实现台词智能跟读与自动跳转。"
                  UIBackgroundModes:
                    - audio
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  PRODUCT_BUNDLE_IDENTIFIER: com.liveprompter.app
                  MARKETING_VERSION: 1.0.0
                  CURRENT_PROJECT_VERSION: 1
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' LivePrompter.xcodeproj/project.pbxproj

      - name: 4. 自动修复源码语法并编译 iOS 应用
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi

          python3 - << 'PYEOF'
          import glob, re, subprocess, sys

          # 1. 修复 SettingsView.swift 等文件中多余的 hex: 参数标签
          for path in glob.glob("LivePrompter/**/*.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = re.sub(r'\bColor\s*\(\s*hex\s*:\s*', 'Color(', content)
              if new_content != content:
                  print(f"已修复 Color(hex:) 调用: {path}")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)

          # 2. 定位 PiPManager.swift 中的 skipByInterval 方法并准备多种兼容签名
          pip_path = "LivePrompter/Services/PiPManager.swift"
          with open(pip_path, "r", encoding="utf-8") as f:
              pip_src = f.read()

          m = re.search(r'[^\n]*\bfunc\s+pictureInPictureController\b[^{]*\bskipByInterval\b[^{]*\{', pip_src)
          if m:
              func_start = m.start()
              brace_start = m.end() - 1
              depth = 0
              func_end = brace_start
              for i in range(brace_start, len(pip_src)):
                  if pip_src[i] == "{":
                      depth += 1
                  elif pip_src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          func_end = i
                          break
              pip_template = pip_src[:func_start] + "    __SKIP_SLOT__\n" + pip_src[func_end + 1:]
          else:
              pip_template = pip_src

          candidates = [
              "func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime) async {}",
              "nonisolated func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime) async {}",
              "func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completionHandler: @escaping () -> Void) { completionHandler() }",
              "nonisolated func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completionHandler: @escaping () -> Void) { completionHandler() }",
              "nonisolated func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completion completionHandler: @escaping () -> Void) { completionHandler() }"
          ]

          cmd = [
              "xcodebuild", "build",
              "-project", "LivePrompter.xcodeproj",
              "-scheme", "LivePrompter",
              "-configuration", "Release",
              "-sdk", "iphoneos",
              "-derivedDataPath", "build",
              "DEVELOPMENT_TEAM=",
              "CODE_SIGN_IDENTITY=",
              "CODE_SIGNING_REQUIRED=NO",
              "CODE_SIGNING_ALLOWED=NO"
          ]

          last_log = ""
          for idx, cand in enumerate(candidates, 1):
              print(f"=== 尝试编译方案 {idx} ===")
              with open(pip_path, "w", encoding="utf-8") as f:
                  f.write(pip_template.replace("__SKIP_SLOT__", cand))
              res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              last_log = res.stdout
              if res.returncode == 0:
                  print(f"✅ 编译成功（方案 {idx}）！")
                  sys.exit(0)
              if "AVPictureInPictureSampleBufferPlaybackDelegate" not in last_log:
                  break

          print("========== 编译错误详情 ==========")
          lines = last_log.splitlines()
          for i, line in enumerate(lines):
              if "error:" in line:
                  start = max(0, i - 4)
                  end = min(len(lines), i + 6)
                  for j in range(start, end):
                      print(f"{j+1}: {lines[j]}")
                  print("-" * 40)
          sys.exit(1)
          PYEOF

      - name: 5. 封装打包成标准 .ipa 安装包
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "LivePrompter.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译产物 LivePrompter.app"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -q LivePrompter.ipa Payload

      - name: 6. 上传 .ipa 供浏览器直接下载
        uses: actions/upload-artifact@v4
        with:
          name: LivePrompter-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/LivePrompter.ipa
